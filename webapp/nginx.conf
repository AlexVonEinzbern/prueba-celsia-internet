server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API no expone cabeceras CORS: nginx actúa como proxy inverso para
    # que el navegador hable siempre con su mismo origen.
    # host.docker.internal apunta al host donde corre la API (extra_hosts
    # en docker-compose.yml lo habilita también en Linux).
    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
