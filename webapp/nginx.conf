server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El navegador llama a la API directamente: el backend expone las
    # cabeceras CORS necesarias. nginx solo sirve el build estático.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
